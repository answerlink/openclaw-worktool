name: package-ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-pack-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build + Pack + Verify
        run: npm run release:local

      - name: Show Dist Artifacts
        run: ls -lah dist
